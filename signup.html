<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Noventra</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <main class="shell">
    <!-- Left purple panel -->
    <section class="brand-panel">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>

      <a class="logo" href="login.html">
        <img src="images/Noventra-logo.jpeg" alt="Noventra" />
        Noventra
      </a>

      <div class="brand-copy">
        <h1>Your Career<br />Journey Starts<br />Here</h1>
        <ul class="benefits">
          <li><span class="check">✓</span> Search and apply for jobs</li>
          <li><span class="check">✓</span> Save your favorite jobs</li>
          <li><span class="check">✓</span> Track your applications</li>
          <li><span class="check">✓</span> Get job recommendations</li>
        </ul>
      </div>

      <div class="art">
        <img src="images/Signup-banner.png" alt="Signup banner" />
      </div>
    </section>

    <!-- Right signup form -->
    <section class="form-panel">
      <div class="form-wrap">
        <h2>Create Account</h2>
        <p class="sub">Sign up for your Noventra account</p>

        <form id="signupForm">
          <div class="field">
            <img class="icon" src="images/user.svg" alt="" />
            <input type="text" id="signupName" placeholder="Full name" required />
          </div>

          <div class="field">
            <img class="icon" src="images/email.svg" alt="" />
            <input type="email" id="signupEmail" placeholder="Email address" required />
          </div>

          <div class="field">
            <img class="icon" src="images/lock.svg" alt="" />
            <input type="password" id="signupPassword" placeholder="Password" required />
          </div>

          <div class="field">
            <img class="icon" src="images/lock.svg" alt="" />
            <div class="input-group">
              <input type="password" id="confirmPassword" placeholder="Confirm password" required />
            </div>
          </div>

          <label class="remember">
            <input type="checkbox" id="termsCheckbox" required />I agree to the Terms and Privacy Policy
          </label>

          <button class="submit" type="submit">Sign Up</button>
        </form>

        <p class="divider">Or sign up with</p>

        <div class="socials">
          <button class="social" type="button">
            <img src="images/google.svg" alt="Google" /> Google
          </button>
          <button class="social" type="button">
            <img src="images/linkedin.svg" alt="LinkedIn" /> LinkedIn
          </button>
        </div>

        <p class="switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </section>
  </main>
  <script src="js/signup.js"></script>
</body>

</html>
